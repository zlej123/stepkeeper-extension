<!doctype html>
<meta charset="utf-8">
<title>stepkeeper</title>
<style>
  body { font-family: -apple-system, 'Helvetica Neue', 'Malgun Gothic', sans-serif;
         width: 340px; padding: 14px; font-size: 13px; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  input, select { width: 100%; padding: 6px; box-sizing: border-box; }
  button { margin-top: 14px; width: 100%; padding: 9px; border: 0; border-radius: 8px;
           background: #e5484d; color: #fff; font-weight: 600; cursor: pointer; }
  small { color: #666; }
  #saved { color: #2e7d32; display: none; }
</style>
<!-- 문구는 options.js가 저장된 출력 언어(없으면 브라우저 로케일)로 채운다 -->
<h3>stepkeeper</h3>
<label data-i18n="optKey"></label>
<input id="apiKey" type="password" data-i18n-placeholder="optKeyPlaceholder">
<small><a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a><span data-i18n="optKeyHint"></span></small>
<label data-i18n="optLanguage"></label>
<select id="language">
  <option value="en">English</option><option value="ko">한국어</option><option value="ja">日本語</option>
</select>
<label data-i18n="optModel"></label>
<input id="model" placeholder="gemini-flash-lite-latest">
<label data-i18n="optServer"></label>
<input id="serverUrl" data-i18n-placeholder="optServerPlaceholder">
<label data-i18n="optVault"></label>
<input id="vault" data-i18n-placeholder="optVaultPlaceholder">
<small data-i18n="optVaultHint"></small>
<button id="save" data-i18n="optSave"></button>
<p id="saved" data-i18n="optSaved"></p>
<script src="i18n.js"></script>
<script src="options.js"></script>
